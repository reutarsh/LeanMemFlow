# ──────────────────────────────────────────────────────────────
# LeanMemFlow – MemProcFS CSV extractors only
# ──────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leanmemflow"
version = "0.1.0"
description = "Lean MemProcFS CSV extractors — copy and enrich forensic CSVs (no parse/SQL)."
readme = "README.txt"
requires-python = ">=3.10"
license = {text = "Proprietary"}
keywords = ["forensics", "memory", "memprocfs", "csv", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<6",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
leanmemflow-extract = "run_extract:main"

[tool.setuptools]
py-modules = ["run_extract"]

[tool.setuptools.packages.find]
include = [
    "memflow_common",
    "memflow_common.*",
    "extractors",
    "extractors.*",
]
exclude = [
    "tests",
    "tests.*",
    "docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
